<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="silkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1E40"/>
      <stop offset="40%" stop-color="#123060"/>
      <stop offset="80%" stop-color="#1B4580"/>
      <stop offset="100%" stop-color="#0B1E40"/>
    </linearGradient>
    <linearGradient id="goldZari" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="drapeShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="sareeGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 5 L35 20 L20 35 L5 20 Z" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-opacity="0.3"/>
      <circle cx="20" cy="20" r="2" fill="#F3E5AB" fill-opacity="0.4"/>
    </pattern>
    <pattern id="borderPattern" width="30" height="40" patternUnits="userSpaceOnUse">
      
      <circle cx="15" cy="20" r="8" fill="none" stroke="url(#goldZari)" stroke-width="1.5"/>
      <circle cx="15" cy="20" r="3" fill="url(#goldZari)"/>
      <path d="M15 8 Q 22 15, 15 20 Q 8 15, 15 8 Z" fill="url(#goldZari)" fill-opacity="0.6"/>
    
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="600" height="800" fill="url(#silkBg)"/>
  <rect width="600" height="800" fill="url(#sareeGrid)"/>

  <!-- Saree Folds & Dynamic Pleats -->
  <path d="M-100 200 Q 180 360, 660 144 L660 880.0000000000001 L-100 880.0000000000001 Z" fill="#0B1E40" fill-opacity="0.45"/>
  <path d="M-100 360 Q 240 520, 660 304 L660 880.0000000000001 L-100 880.0000000000001 Z" fill="#000000" fill-opacity="0.3"/>
  <path d="M-100 520 Q 300 680, 660 463.99999999999994 L660 880.0000000000001 L-100 880.0000000000001 Z" fill="#000000" fill-opacity="0.45"/>

  <!-- Satin Sheen -->
  <rect width="600" height="800" fill="url(#drapeShine)"/>

  <!-- Rich Zari Borders -->
  <rect x="0" y="0" width="600" height="36" fill="url(#borderPattern)"/>
  <line x1="0" y1="38" x2="600" y2="38" stroke="url(#goldZari)" stroke-width="2"/>
  
  <rect x="0" y="760" width="600" height="40" fill="url(#borderPattern)"/>
  <line x1="0" y1="758" x2="600" y2="758" stroke="url(#goldZari)" stroke-width="2"/>

  <!-- Side Pallu Trim -->
  <rect x="555" y="0" width="45" height="800" fill="#000000" fill-opacity="0.25"/>
  <line x1="554" y1="0" x2="554" y2="800" stroke="url(#goldZari)" stroke-width="1.5"/>

  <!-- Central Emblem / Artisan Seal -->
  <g transform="translate(300, 370)">
    <circle r="120" fill="none" stroke="url(#goldZari)" stroke-width="1.5" stroke-dasharray="5,4" stroke-opacity="0.7"/>
    <circle r="105" fill="#0B1E40" fill-opacity="0.85" stroke="url(#goldZari)" stroke-width="2"/>
    <circle r="90" fill="none" stroke="#F3E5AB" stroke-width="1" stroke-opacity="0.35"/>
    
    <!-- Decorative Mandalas -->
    <path d="M0 -75 L25 -25 L75 0 L25 25 L0 75 L-25 25 L-75 0 L-25 -25 Z" fill="url(#goldZari)" fill-opacity="0.2" stroke="url(#goldZari)" stroke-width="1"/>
    
    <circle r="50" fill="#110507" fill-opacity="0.6" stroke="url(#goldZari)" stroke-width="1.5"/>
    <text x="0" y="-6" font-family="Cinzel, 'Playfair Display', Georgia, serif" font-size="28" font-weight="bold" fill="url(#goldZari)" text-anchor="middle" letter-spacing="3">VG</text>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#F3E5AB" text-anchor="middle" letter-spacing="2.5">COLLECTIONS</text>
    <text x="0" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#D4AF37" text-anchor="middle" letter-spacing="1.5">PURE GEORGETTE SAREE</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 720)">
    <rect x="-180" y="-18" width="360" height="36" rx="2" fill="#0F0507" fill-opacity="0.88" stroke="url(#goldZari)" stroke-width="1"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#F3E5AB" text-anchor="middle" letter-spacing="2.5">BANARASI GEORGETTE ELEGANCE</text>
  </g>
</svg>