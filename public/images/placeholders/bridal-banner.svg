<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 700" width="100%" height="100%">
  <defs>
    <linearGradient id="silkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D000A"/>
      <stop offset="40%" stop-color="#5E0413"/>
      <stop offset="80%" stop-color="#800B20"/>
      <stop offset="100%" stop-color="#3D000A"/>
    </linearGradient>
    <linearGradient id="goldZari" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5B842"/>
      <stop offset="50%" stop-color="#FFF2B2"/>
      <stop offset="100%" stop-color="#E5B842"/>
    </linearGradient>
    <linearGradient id="drapeShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="sareeGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 5 L35 20 L20 35 L5 20 Z" fill="none" stroke="#E5B842" stroke-width="0.75" stroke-opacity="0.3"/>
      <circle cx="20" cy="20" r="2" fill="#FFF2B2" fill-opacity="0.4"/>
    </pattern>
    <pattern id="borderPattern" width="30" height="40" patternUnits="userSpaceOnUse">
      
      <polygon points="15,5 30,35 0,35" fill="url(#goldZari)" fill-opacity="0.85"/>
      <circle cx="15" cy="22" r="2" fill="#3D000A"/>
    
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1440" height="700" fill="url(#silkBg)"/>
  <rect width="1440" height="700" fill="url(#sareeGrid)"/>

  <!-- Saree Folds & Dynamic Pleats -->
  <path d="M-100 175 Q 432 315, 1584.0000000000002 126 L1584.0000000000002 770.0000000000001 L-100 770.0000000000001 Z" fill="#3D000A" fill-opacity="0.45"/>
  <path d="M-100 315 Q 576 455, 1584.0000000000002 266 L1584.0000000000002 770.0000000000001 L-100 770.0000000000001 Z" fill="#000000" fill-opacity="0.3"/>
  <path d="M-100 455 Q 720 595, 1584.0000000000002 406 L1584.0000000000002 770.0000000000001 L-100 770.0000000000001 Z" fill="#000000" fill-opacity="0.45"/>

  <!-- Satin Sheen -->
  <rect width="1440" height="700" fill="url(#drapeShine)"/>

  <!-- Rich Zari Borders -->
  <rect x="0" y="0" width="1440" height="36" fill="url(#borderPattern)"/>
  <line x1="0" y1="38" x2="1440" y2="38" stroke="url(#goldZari)" stroke-width="2"/>
  
  <rect x="0" y="660" width="1440" height="40" fill="url(#borderPattern)"/>
  <line x1="0" y1="658" x2="1440" y2="658" stroke="url(#goldZari)" stroke-width="2"/>

  <!-- Side Pallu Trim -->
  <rect x="1395" y="0" width="45" height="700" fill="#000000" fill-opacity="0.25"/>
  <line x1="1394" y1="0" x2="1394" y2="700" stroke="url(#goldZari)" stroke-width="1.5"/>

  <!-- Central Emblem / Artisan Seal -->
  <g transform="translate(720, 330)">
    <circle r="90" fill="none" stroke="url(#goldZari)" stroke-width="1.5" stroke-dasharray="5,4" stroke-opacity="0.7"/>
    <circle r="75" fill="#3D000A" fill-opacity="0.85" stroke="url(#goldZari)" stroke-width="2"/>
    <circle r="62" fill="none" stroke="#FFF2B2" stroke-width="1" stroke-opacity="0.35"/>
    
    <!-- Decorative Mandalas -->
    <path d="M0 -55 L20 -20 L55 0 L20 20 L0 55 L-20 20 L-55 0 L-20 -20 Z" fill="url(#goldZari)" fill-opacity="0.2" stroke="url(#goldZari)" stroke-width="1"/>
    
    <circle r="40" fill="#110507" fill-opacity="0.6" stroke="url(#goldZari)" stroke-width="1.5"/>
    <text x="0" y="-5" font-family="Cinzel, 'Playfair Display', Georgia, serif" font-size="22" font-weight="bold" fill="url(#goldZari)" text-anchor="middle" letter-spacing="3">VG</text>
    <text x="0" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#FFF2B2" text-anchor="middle" letter-spacing="2.5">COLLECTIONS</text>
    <text x="0" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" fill="#E5B842" text-anchor="middle" letter-spacing="1.5">HEIRLOOM WEDDING COLLECTION</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(720, 630)">
    <rect x="-200" y="-18" width="400" height="36" rx="2" fill="#0F0507" fill-opacity="0.88" stroke="url(#goldZari)" stroke-width="1"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFF2B2" text-anchor="middle" letter-spacing="2.5">BRIDAL SAREES FOR HER PERFECT DAY</text>
  </g>
</svg>