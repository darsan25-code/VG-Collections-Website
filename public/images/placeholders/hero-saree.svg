<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <linearGradient id="silkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0910"/>
      <stop offset="40%" stop-color="#5C101C"/>
      <stop offset="80%" stop-color="#7D1A2A"/>
      <stop offset="100%" stop-color="#3B0910"/>
    </linearGradient>
    <linearGradient id="goldZari" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="drapeShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="sareeGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 5 L35 20 L20 35 L5 20 Z" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-opacity="0.3"/>
      <circle cx="20" cy="20" r="2" fill="#F3E5AB" fill-opacity="0.4"/>
    </pattern>
    <pattern id="borderPattern" width="30" height="40" patternUnits="userSpaceOnUse">
      
      <polygon points="15,5 30,35 0,35" fill="url(#goldZari)" fill-opacity="0.85"/>
      <circle cx="15" cy="22" r="2" fill="#3B0910"/>
    
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1440" height="900" fill="url(#silkBg)"/>
  <rect width="1440" height="900" fill="url(#sareeGrid)"/>

  <!-- Saree Folds & Dynamic Pleats -->
  <path d="M-100 225 Q 432 405, 1584.0000000000002 162 L1584.0000000000002 990.0000000000001 L-100 990.0000000000001 Z" fill="#3B0910" fill-opacity="0.45"/>
  <path d="M-100 405 Q 576 585, 1584.0000000000002 342 L1584.0000000000002 990.0000000000001 L-100 990.0000000000001 Z" fill="#000000" fill-opacity="0.3"/>
  <path d="M-100 585 Q 720 765, 1584.0000000000002 522 L1584.0000000000002 990.0000000000001 L-100 990.0000000000001 Z" fill="#000000" fill-opacity="0.45"/>

  <!-- Satin Sheen -->
  <rect width="1440" height="900" fill="url(#drapeShine)"/>

  <!-- Rich Zari Borders -->
  <rect x="0" y="0" width="1440" height="36" fill="url(#borderPattern)"/>
  <line x1="0" y1="38" x2="1440" y2="38" stroke="url(#goldZari)" stroke-width="2"/>
  
  <rect x="0" y="860" width="1440" height="40" fill="url(#borderPattern)"/>
  <line x1="0" y1="858" x2="1440" y2="858" stroke="url(#goldZari)" stroke-width="2"/>

  <!-- Side Pallu Trim -->
  <rect x="1395" y="0" width="45" height="900" fill="#000000" fill-opacity="0.25"/>
  <line x1="1394" y1="0" x2="1394" y2="900" stroke="url(#goldZari)" stroke-width="1.5"/>

  <!-- Central Emblem / Artisan Seal -->
  <g transform="translate(720, 430)">
    <circle r="90" fill="none" stroke="url(#goldZari)" stroke-width="1.5" stroke-dasharray="5,4" stroke-opacity="0.7"/>
    <circle r="75" fill="#3B0910" fill-opacity="0.85" stroke="url(#goldZari)" stroke-width="2"/>
    <circle r="62" fill="none" stroke="#F3E5AB" stroke-width="1" stroke-opacity="0.35"/>
    
    <!-- Decorative Mandalas -->
    <path d="M0 -55 L20 -20 L55 0 L20 20 L0 55 L-20 20 L-55 0 L-20 -20 Z" fill="url(#goldZari)" fill-opacity="0.2" stroke="url(#goldZari)" stroke-width="1"/>
    
    <circle r="40" fill="#110507" fill-opacity="0.6" stroke="url(#goldZari)" stroke-width="1.5"/>
    <text x="0" y="-5" font-family="Cinzel, 'Playfair Display', Georgia, serif" font-size="22" font-weight="bold" fill="url(#goldZari)" text-anchor="middle" letter-spacing="3">VG</text>
    <text x="0" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#F3E5AB" text-anchor="middle" letter-spacing="2.5">COLLECTIONS</text>
    <text x="0" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" fill="#D4AF37" text-anchor="middle" letter-spacing="1.5">HERITAGE KANCHIPURAM SILKS</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(720, 830)">
    <rect x="-200" y="-18" width="400" height="36" rx="2" fill="#0F0507" fill-opacity="0.88" stroke="url(#goldZari)" stroke-width="1"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#F3E5AB" text-anchor="middle" letter-spacing="2.5">TIMELESS SAREES · ETERNAL ELEGANCE</text>
  </g>
</svg>